name: Daily Executive Operations Report (7:30 PM IST)

on:
  schedule:
    # Runs every day at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  dispatch-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install g4f certifi --quiet

      - name: Generate and Dispatch Daily Report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: |
          cd ai-agents
          python agents/analyst_bi/daily_report.py

      - name: Archive Daily Summaries
        uses: actions/upload-artifact@v4
        with:
          name: daily-summaries
          path: ai-agents/output/summaries/
          retention-days: 60
