name: Daily B2B Lead Generator

on:
  schedule:
    # Runs at 02:30 UTC (08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  run-lead-hunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install g4f certifi --quiet
      - run: |
          cd ai-agents
          python agents/hunter_lead_generator/lead_hunter.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-lead-proposals
          path: ai-agents/output/
          retention-days: 14
