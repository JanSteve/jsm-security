name: Social Media Content Generator

on:
  schedule:
    # Runs at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  run-content-king:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install g4f certifi --quiet
      - run: |
          cd ai-agents
          python agents/content_king_seo/social_media_autoposter.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-social-campaigns
          path: ai-agents/output/
          retention-days: 14
