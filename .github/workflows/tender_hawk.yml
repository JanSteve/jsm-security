name: Tender Hawk (Govt & GeM Tender Bids)

on:
  schedule:
    # 10:00 AM IST (04:30 UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run-tender-hawk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install g4f certifi --quiet
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: |
          cd ai-agents
          python agents/tender_hawk/tender_monitor.py
          python dispatch_demo_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-tender-evaluations
          path: ai-agents/output/
          retention-days: 14
