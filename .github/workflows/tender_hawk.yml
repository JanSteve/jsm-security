name: Tender Hawk Monitor

on:
  schedule:
    # Runs at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  run-tender-hawk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install g4f certifi --quiet
      - run: |
          cd ai-agents
          python agents/tender_hawk/tender_monitor.py
      - uses: actions/upload-artifact@v4
        with:
          name: daily-tender-evaluations
          path: ai-agents/output/
          retention-days: 14
