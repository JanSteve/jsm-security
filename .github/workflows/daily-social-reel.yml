name: Automated Daily Social Reel Publisher

on:
  schedule:
    # Runs daily at 09:00 AM IST (03:30 UTC) for optimal B2B executive engagement
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      manual_note:
        description: 'Optional manual dispatch trigger note'
        required: false
        default: 'Manual trigger from GitHub UI'

permissions:
  contents: read

jobs:
  dispatch-social-reel:
    name: Dispatch Daily Reel to Instagram, Facebook & YouTube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Dispatch Viral Reel to Make.com Webhook
        run: node scripts/daily-social-dispatch.mjs
        env:
          NEXT_PUBLIC_SITE_URL: https://www.jsmintegratedservices.com
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
