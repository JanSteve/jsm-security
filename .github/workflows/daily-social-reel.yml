name: Automated Daily Social Reel Publisher

on:
  schedule:
    # 2x Daily Automated Publishing (IST Prime Slots):
    # 1) 08:45 AM IST (03:15 UTC) — Morning executive commute & plant startup review
    - cron: '15 3 * * *'
    # 2) 07:00 PM IST (13:30 UTC) — Evening executive downtime & shift handover review
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (morning = 8:45 AM IST story, evening = 7:00 PM IST story)'
        type: choice
        required: true
        default: 'auto'
        options:
          - 'auto'
          - 'morning'
          - 'evening'
      story:
        description: 'Story Index Override (0-6, leave empty for automatic daily rotation)'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (Simulate without broadcasting to webhook)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  dispatch-social-reel:
    name: Dispatch 2x Daily Reel to Instagram & Facebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Dispatch Reel Payload to Make.com Webhook
        run: |
          CMD="node scripts/daily-social-dispatch.mjs"
          if [ "${{ inputs.slot }}" != "" ] && [ "${{ inputs.slot }}" != "auto" ]; then
            CMD="$CMD --slot=${{ inputs.slot }}"
          fi
          if [ "${{ inputs.story }}" != "" ]; then
            CMD="$CMD --story=${{ inputs.story }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          echo "Executing: $CMD"
          eval $CMD
        env:
          NEXT_PUBLIC_SITE_URL: https://www.jsmintegratedservices.com
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
