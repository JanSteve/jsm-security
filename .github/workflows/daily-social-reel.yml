name: Automated Daily Social Reel Publisher

on:
  schedule:
    # 2x Daily Automated Publishing (IST Prime Slots + Cloud Backup Ticks):
    # Morning Window (08:30–11:00 AM IST): primary at 08:45 AM & 09:15 AM, plus backup ticks
    - cron: '15 3 * * *'
    - cron: '45 3 * * *'
    - cron: '15 4 * * *'
    - cron: '45 4 * * *'
    - cron: '15 5 * * *'
    # Evening Window (07:00–09:00 PM IST): primary at 07:15 PM & 07:45 PM, plus backup ticks
    - cron: '45 13 * * *'
    - cron: '15 14 * * *'
    - cron: '45 14 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (morning = 8:45 AM IST candidate story, evening = 7:15 PM IST employer story)'
        type: choice
        required: true
        default: 'auto'
        options:
          - 'auto'
          - 'morning'
          - 'evening'
      story:
        description: 'Catalog Day or Reel Override (e.g. 316 or REEL-316-M, leave empty for automatic daily rotation)'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Dry Run Mode (Simulate without broadcasting to webhook)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: jsm-social-reel-lock
  cancel-in-progress: false

jobs:
  dispatch-social-reel:
    name: Dispatch 2x Daily Reel to Instagram & Facebook
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Time-Window & Anti-Spam Synchronized Scheduler
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="node scripts/daily-social-dispatch.mjs"
            if [ "${{ inputs.slot }}" != "" ] && [ "${{ inputs.slot }}" != "auto" ]; then
              CMD="$CMD --slot=${{ inputs.slot }}"
            fi
            if [ "${{ inputs.story }}" != "" ]; then
              if [[ "${{ inputs.story }}" == REEL-* ]]; then
                CMD="$CMD --reel-id=${{ inputs.story }}"
              else
                CMD="$CMD --story=${{ inputs.story }}"
              fi
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
            echo "Executing Manual Dispatch: $CMD"
            eval $CMD
          else
            echo "Executing Scheduled Check via Anti-Spam Scheduler..."
            node scripts/social-scheduler.mjs
          fi
        env:
          NEXT_PUBLIC_SITE_URL: https://www.jsmintegratedservices.com
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}

      - name: Persist Dispatch Ledger to GitHub
        run: |
          git config --global user.name "JSM Automation Bot"
          git config --global user.email "bot@jsmintegratedservices.com"
          git add data/social-dispatch-ledger.json
          if ! git diff --cached --quiet; then
            DATE_STR=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore(social): update dispatch ledger at $DATE_STR [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "✓ Dispatch ledger committed & pushed to main."
          else
            echo "No ledger changes to commit."
          fi
