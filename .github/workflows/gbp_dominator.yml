name: Dominator Local SEO & Google Business Profile

on:
  schedule:
    # Runs daily at 12:30 UTC (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  run-dominator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install g4f certifi --quiet

      - name: Generate Local SEO Updates
        run: |
          python agents/dominator_local_seo/gbp_post_generator.py

      - name: Archive SEO Posts
        uses: actions/upload-artifact@v4
        with:
          name: daily-local-seo-posts
          path: output/
          retention-days: 14
