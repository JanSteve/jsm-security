name: Recruiter HR (Applicant Compliance Screener)

on:
  schedule:
    # Runs daily at 06:00 UTC (11:30 AM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-recruiter-hr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install g4f certifi --quiet

      - name: Screen Applicants
        run: |
          python agents/recruiter_hr/resume_screener.py

      - name: Archive Candidate Screenings
        uses: actions/upload-artifact@v4
        with:
          name: daily-candidate-evaluations
          path: output/
          retention-days: 14
