name: Automated WhatsApp Outreach

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Outreach Engine Provider'
        required: true
        default: 'dry_run'
        type: choice
        options:
          - dry_run
          - ultramsg
          - meta
      daily_limit:
        description: 'Maximum contacts to message in this run'
        required: true
        default: '25'
      leads_file:
        description: 'Path to leads file (CSV or XLSX)'
        required: true
        default: 'leads/daily_leads.csv'

  # Trigger automatically whenever you push or upload a new leads file
  push:
    paths:
      - 'leads/daily_leads.csv'
      - 'leads/daily_leads.xlsx'

permissions:
  contents: write

jobs:
  run-outreach:
    name: WhatsApp Outreach Dispatcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl requests

      - name: Run WhatsApp Outreach Engine
        env:
          PROVIDER: ${{ github.event.inputs.provider || 'dry_run' }}
          DAILY_LIMIT: ${{ github.event.inputs.daily_limit || '25' }}
          LEADS_FILE: ${{ github.event.inputs.leads_file || 'leads/daily_leads.csv' }}
          HISTORY_FILE: 'leads/sent_history.json'
          MIN_DELAY_SECONDS: '8'
          MAX_DELAY_SECONDS: '16'
          
          # Provider Secrets (Configured in GitHub Repository Secrets)
          ULTRAMSG_INSTANCE_ID: ${{ secrets.ULTRAMSG_INSTANCE_ID }}
          ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
          META_PHONE_NUMBER_ID: ${{ secrets.META_PHONE_NUMBER_ID }}
          META_WA_TOKEN: ${{ secrets.META_WA_TOKEN }}
          META_TEMPLATE_NAME: ${{ secrets.META_TEMPLATE_NAME || 'jsm_lead_intro' }}
        run: |
          python scripts/whatsapp_outreach.py

      - name: Commit & Push Updated Outreach History
        run: |
          git config --global user.name "JSM Outreach Bot"
          git config --global user.email "bot@jsmintegratedservices.com"
          git add leads/sent_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(leads): update sent history log [skip ci]" && git push origin main)
