name: Monthly Executive Master Summary (7:00 PM - 8:00 PM IST)

on:
  schedule:
    # Runs on the 1st of every month at 14:00 UTC (7:30 PM IST)
    - cron: '0 14 1 * *'
  workflow_dispatch:

jobs:
  run-monthly-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install g4f certifi --quiet
      - env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTLOOK_EMAIL: ${{ secrets.OUTLOOK_EMAIL }}
          OUTLOOK_PASSWORD: ${{ secrets.OUTLOOK_PASSWORD }}
        run: |
          cd ai-agents
          python agents/analyst_bi/monthly_summary.py
      - uses: actions/upload-artifact@v4
        with:
          name: monthly-summaries
          path: ai-agents/output/summaries/
          retention-days: 90
